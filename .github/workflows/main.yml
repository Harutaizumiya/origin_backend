name: Deploy FastAPI (systemd)

on:
  push:
    branches:
      - supabase_dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Debian server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/code/origin_backend
            git pull origin supabase_dev
            sudo systemctl restart origin_backend
